name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: hunch.mjs is what src/ makes
        run: git diff --exit-code -- hunch.mjs
      - run: node hunch.mjs check --root examples/shop --json
