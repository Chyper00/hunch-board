name: Test action
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: hunch
        uses: ./
        with:
          root: examples/shop
          version: github:Chyper00/hunch-board#release/1.1.0
      - run: echo "drift=${{ steps.hunch.outputs.drift }}"
